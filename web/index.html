<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e5383b'/%3E%3Cpath d='M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M10 24h12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --text: #1b1f24;
    --muted: #5f6b7a;
    --border: #e1e5ea;
    --accent: #e5383b;
    --accent-hover: #c9292c;
    --accent-soft: #fdecec;
    --ok: #2e7d32;
    --warn: #a15c00;
    --error: #c62828;
    --info: #1565c0;
    --track: #e9ecf0;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 16px rgba(16, 24, 40, .06);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-2: #1d2129;
      --text: #e8eaed;
      --muted: #9aa4b2;
      --border: #2a2f3a;
      --accent: #ff5a5f;
      --accent-hover: #ff7478;
      --accent-soft: #3a1d20;
      --ok: #66bb6a;
      --warn: #ffb74d;
      --error: #ef5350;
      --info: #64b5f6;
      --track: #262b35;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1d2129;
    --text: #e8eaed;
    --muted: #9aa4b2;
    --border: #2a2f3a;
    --accent: #ff5a5f;
    --accent-hover: #ff7478;
    --accent-soft: #3a1d20;
    --ok: #66bb6a;
    --warn: #ffb74d;
    --error: #ef5350;
    --info: #64b5f6;
    --track: #262b35;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Leelawadee UI", "Segoe UI", "Noto Sans Thai", Tahoma, system-ui, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 28px 16px 48px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; background: var(--accent);
    display: grid; place-items: center; flex: none;
  }
  .logo svg { width: 24px; height: 24px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.2; }
  .subtitle { color: var(--muted); font-size: 13px; }
  .badges { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    white-space: nowrap;
  }
  .badge.ok::before, .badge.bad::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .badge.ok::before { background: var(--ok); }
  .badge.bad::before { background: var(--error); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
  }
  .row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row-head label, .section-label { font-weight: 600; }
  .row-head .hint { color: var(--muted); font-size: 13px; }
  .row-head .spacer { flex: 1; }

  textarea, input[type="text"] {
    width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 112px; resize: vertical; white-space: pre; overflow-x: auto; }
  textarea:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .section-label { display: block; margin: 18px 0 8px; }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .mode span {
    display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
    padding: 12px 8px; border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer;
    background: var(--surface-2); transition: border-color .15s, background .15s;
  }
  .mode svg { width: 22px; height: 22px; color: var(--muted); margin-bottom: 2px; }
  .mode b { font-size: 15px; }
  .mode small { color: var(--muted); font-size: 12px; }
  .mode span:hover { border-color: var(--muted); }
  .mode input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
  .mode input:checked + span svg { color: var(--accent); }
  .mode input:focus-visible + span { box-shadow: 0 0 0 3px var(--accent-soft); }

  .check { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; cursor: pointer; user-select: none; }
  .check input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }

  .folder { display: flex; gap: 8px; }
  .folder input { flex: 1; min-width: 0; }

  button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button svg { width: 18px; height: 18px; flex: none; }
  button.small { padding: 5px 12px; font-size: 13px; font-weight: 500; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 11px 26px; font-size: 16px; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.ghost { background: transparent; }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; align-items: center; }
  .actions .spacer { flex: 1; }
  .kbd { color: var(--muted); font-size: 12px; }

  .status-row { display: flex; align-items: baseline; gap: 12px; }
  #status { font-weight: 700; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #percent { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; color: var(--accent); }
  .bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
  .bar > div {
    height: 100%; width: 0; background: var(--accent); border-radius: 999px;
    transition: width .3s ease;
  }
  .busy .bar > div {
    background-image: linear-gradient(45deg, rgba(255,255,255,.22) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.22) 75%, transparent 75%);
    background-size: 18px 18px; animation: stripes 0.8s linear infinite;
  }
  .done-ok .bar > div { background: var(--ok); }
  .done-ok #percent { color: var(--ok); }
  @keyframes stripes { to { background-position: 18px 0; } }
  #detail { color: var(--muted); font-size: 13px; min-height: 20px; font-variant-numeric: tabular-nums; }

  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  summary .spacer { flex: 1; }
  #log {
    margin-top: 8px; height: 220px; overflow: auto; padding: 10px 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    font: 12.5px/1.6 "Cascadia Mono", Consolas, "Leelawadee UI", monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  #log .error { color: var(--error); }
  #log .warn { color: var(--warn); }
  #log .ok { color: var(--ok); font-weight: 600; }
  #log .info { color: var(--info); font-weight: 600; }
  #log:empty::before { content: "ยังไม่มีรายการ"; color: var(--muted); }

  .banner {
    display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px;
    background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent);
  }
  .banner.show { display: block; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: calc(100% - 32px); box-shadow: var(--shadow);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }

  @media (max-width: 600px) {
    .wrap { padding-top: 18px; }
    .card { padding: 16px; }
    .modes { grid-template-columns: repeat(2, 1fr); }
    .folder { flex-wrap: wrap; }
    .folder input { flex-basis: 100%; }
    .folder button { flex: 1; }
    .actions .kbd { display: none; }
    .badges { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M6 20h12"/></svg>
    </div>
    <div>
      <h1>YouTube Downloader</h1>
      <div class="subtitle">ดาวน์โหลดวิดีโอและเสียงในเครื่องของคุณ ด้วย yt-dlp</div>
    </div>
    <div class="badges">
      <span class="badge" id="badge-ytdlp">yt-dlp …</span>
      <span class="badge" id="badge-ffmpeg">ffmpeg …</span>
    </div>
  </header>

  <div class="banner" id="banner" role="alert"></div>

  <section class="card">
    <div class="row-head">
      <label for="urls">ลิงก์ YouTube</label>
      <span class="hint">1 บรรทัดต่อ 1 ลิงก์</span>
      <span class="spacer"></span>
      <button class="small" id="btn-paste" type="button">วางลิงก์</button>
      <button class="small ghost" id="btn-clear" type="button">ล้าง</button>
    </div>
    <textarea id="urls" spellcheck="false" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>

    <span class="section-label" id="mode-label">รูปแบบ</span>
    <div class="modes" id="modes" role="radiogroup" aria-labelledby="mode-label"></div>

    <label class="check"><input type="checkbox" id="playlist"> ดาวน์โหลดทั้งเพลย์ลิสต์ (เมื่อลิงก์อยู่ในเพลย์ลิสต์)</label>

    <label class="section-label" for="out-dir">บันทึกที่</label>
    <div class="folder">
      <input type="text" id="out-dir" spellcheck="false">
      <button type="button" id="btn-choose">เลือก…</button>
      <button type="button" id="btn-open">เปิดโฟลเดอร์</button>
    </div>

    <div class="actions">
      <button class="primary" id="btn-download" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M6 20h12"/></svg>
        ดาวน์โหลด
      </button>
      <button id="btn-cancel" type="button" disabled>ยกเลิก</button>
      <span class="kbd">Ctrl + Enter</span>
      <span class="spacer"></span>
      <button class="ghost" id="btn-update" type="button">อัปเดต yt-dlp</button>
    </div>
  </section>

  <section class="card" id="progress-card">
    <div class="status-row">
      <div id="status" aria-live="polite">พร้อมดาวน์โหลด</div>
      <div id="percent"></div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="status"><div id="bar"></div></div>
    <div id="detail"></div>
    <details id="log-box" open>
      <summary>บันทึกการทำงาน <span class="spacer"></span><button class="small ghost" id="btn-clear-log" type="button">ล้าง</button></summary>
      <div id="log"></div>
    </details>
  </section>

  <footer>ทำงานในเครื่องนี้เท่านั้น · ปิดหน้าต่าง console ของ web.bat เพื่อหยุดเซิร์ฟเวอร์ · โปรดดาวน์โหลดเฉพาะเนื้อหาที่คุณมีสิทธิ์ใช้งาน</footer>
</div>
<div id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const ICON_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>';
const ICON_AUDIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>';
// ชื่อที่แสดงบนการ์ด (ถ้าไม่มีในนี้ จะใช้ชื่อจากเซิร์ฟเวอร์)
const MODE_CARDS = {
  best: ["คุณภาพสูงสุด", "วิดีโอ MP4", ICON_VIDEO],
  "1080": ["1080p", "วิดีโอ MP4", ICON_VIDEO],
  "720": ["720p", "วิดีโอ MP4", ICON_VIDEO],
  mp3: ["MP3", "เสียงอย่างเดียว", ICON_AUDIO],
};

let since = 0;
let busy = false;
let wasBusy = false;
let online = true;
let polling = false;
let pollTimer;
let toastTimer;

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
}

function banner(message) {
  $("banner").textContent = message || "";
  $("banner").classList.toggle("show", Boolean(message));
}

function selectedMode() {
  const checked = document.querySelector('input[name="mode"]:checked');
  return checked ? checked.value : "best";
}

function renderModes(modes, current) {
  $("modes").innerHTML = "";
  for (const { id: key, label } of modes) {
    const [title, sub, icon] = MODE_CARDS[key] || [label, "", ICON_VIDEO];
    const wrap = document.createElement("label");
    wrap.className = "mode";
    wrap.title = label;
    wrap.innerHTML = `<input type="radio" name="mode"><span>${icon}<b></b><small></small></span>`;
    wrap.querySelector("input").value = key;
    wrap.querySelector("input").checked = key === current;
    wrap.querySelector("b").textContent = title;
    wrap.querySelector("small").textContent = sub;
    $("modes").appendChild(wrap);
  }
}

function setBadge(id, ok, text) {
  const el = $(id);
  el.textContent = text;
  el.className = "badge " + (ok ? "ok" : "bad");
}

async function loadInfo() {
  const info = await api("/api/info");
  renderModes(info.modes, info.settings.mode);
  $("playlist").checked = info.settings.playlist;
  $("out-dir").value = info.settings.out_dir;
  setBadge("badge-ytdlp", Boolean(info.ytdlp), info.ytdlp ? `yt-dlp ${info.ytdlp}` : "ไม่พบ yt-dlp");
  setBadge("badge-ffmpeg", info.ffmpeg, info.ffmpeg ? "ffmpeg พร้อม" : "ไม่พบ ffmpeg");
  if (!info.ytdlp) banner("ไม่พบ bin\\yt-dlp.exe — กรุณารัน setup.bat ก่อน แล้วรีเฟรชหน้านี้");
}

function appendLog(entries) {
  if (!entries.length) return;
  const log = $("log");
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  for (const entry of entries) {
    if (entry.id <= since) continue;
    const line = document.createElement("div");
    line.textContent = entry.text;
    if (entry.tag) line.className = entry.tag;
    log.appendChild(line);
    since = Math.max(since, entry.id);
  }
  while (log.childElementCount > 1000) log.firstElementChild.remove();
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

function render(s) {
  busy = s.busy;
  const doneOk = !busy && s.kind === "download" && s.result === "ok";
  $("status").textContent = s.status;
  $("status").title = s.status;
  $("detail").textContent = s.detail;
  const showPercent = busy || doneOk;
  $("percent").textContent = showPercent && s.percent > 0 ? `${Math.floor(s.percent)}%` : "";
  $("bar").style.width = `${s.percent}%`;
  document.querySelector(".bar").setAttribute("aria-valuenow", Math.round(s.percent));
  $("progress-card").classList.toggle("busy", busy);
  $("progress-card").classList.toggle("done-ok", doneOk);
  appendLog(s.log);

  $("btn-download").disabled = busy;
  $("btn-update").disabled = busy;
  $("btn-cancel").disabled = !busy || s.status === "กำลังยกเลิก...";

  if (busy) {
    document.title = `${Math.floor(s.percent)}% · YouTube Downloader`;
  } else if (wasBusy) {
    document.title = (doneOk ? "✓ เสร็จแล้ว" : s.status) + " · YouTube Downloader";
    if (s.kind === "update") loadInfo().catch(() => {});
  }
  wasBusy = busy;
}

function schedulePoll(ms) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, ms);
}

async function poll() {
  if (polling) return;  // มี request ค้างอยู่แล้ว - รอบนั้นจะตั้งเวลารอบถัดไปเอง
  polling = true;
  try {
    render(await api(`/api/status?since=${since}`));
    if (!online) { online = true; banner(""); loadInfo().catch(() => {}); }
  } catch {
    if (online) {
      online = false;
      banner("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ถ้าปิดหน้าต่าง web.bat ไปแล้ว ให้เปิด web.bat อีกครั้ง");
    }
    $("btn-download").disabled = true;
    $("btn-update").disabled = true;
  } finally {
    polling = false;
    schedulePoll(busy ? 400 : 1500);
  }
}

async function run(action) {
  try {
    await action();
  } catch (e) {
    toast(e.message);
  }
}

$("btn-download").onclick = () => run(async () => {
  const urls = $("urls").value.split(/\s+/).filter(Boolean);
  if (!urls.length) { toast("กรุณาวางลิงก์ YouTube อย่างน้อย 1 ลิงก์"); $("urls").focus(); return; }
  await api("/api/download", {
    urls,
    mode: selectedMode(),
    playlist: $("playlist").checked,
    out_dir: $("out-dir").value,
  });
  busy = true;
  $("btn-download").disabled = true;
  schedulePoll(200);
});

$("btn-cancel").onclick = () => run(() => api("/api/cancel", {}));
$("btn-update").onclick = () => run(async () => {
  await api("/api/update", {});
  busy = true;
  schedulePoll(200);
});
$("btn-open").onclick = () => run(() => api("/api/open-folder", { out_dir: $("out-dir").value }));
$("btn-choose").onclick = () => run(async () => {
  toast("เลือกโฟลเดอร์ในหน้าต่างที่เปิดขึ้นมา");
  const { path } = await api("/api/choose-folder", { initial: $("out-dir").value });
  if (path) $("out-dir").value = path;
});

$("btn-paste").onclick = () => run(async () => {
  let text;
  try {
    text = (await navigator.clipboard.readText()).trim();
  } catch {
    $("urls").focus();
    toast("เบราว์เซอร์ไม่อนุญาตให้อ่านคลิปบอร์ด — คลิกในช่องแล้วกด Ctrl+V แทน");
    return;
  }
  if (!text) return;
  const box = $("urls");
  box.value = box.value && !box.value.endsWith("\n") ? `${box.value}\n${text}\n` : `${box.value}${text}\n`;
});
$("btn-clear").onclick = () => { $("urls").value = ""; $("urls").focus(); };
$("btn-clear-log").onclick = (e) => { e.preventDefault(); $("log").innerHTML = ""; };

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !$("btn-download").disabled) {
    e.preventDefault();
    $("btn-download").click();
  }
});

loadInfo()
  .catch((e) => banner(`โหลดข้อมูลไม่สำเร็จ: ${e.message}`))
  .finally(poll);
</script>
</body>
</html>
